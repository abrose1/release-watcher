# Cron schedules + module commands below. Builders also need a default start phase —
# root main.py + nixpacks.toml satisfy Nixpacks/Railpack; see README Deployment.
[build]
builder = "nixpacks"

[[services]]
name = "daily-scan-cron"
type = "cron"
schedule = "0 14 * * *"
startCommand = "python -m watcher.jobs.watchlist"

[[services]]
name = "announcement-scan-cron"
type = "cron"
schedule = "0 14 * * *"
startCommand = "python -m watcher.jobs.announcement"

# DISABLED (Nov 2026): weekly-discovery-cron is intentionally turned off on Railway.
# Its "Music similar to …" / "Books similar to …" texts were low-value spam. Do not
# re-add or redeploy it unless the user asks. Code stays in watcher/jobs/discovery.py.
# Railway service: no schedule + no-op echo start command (see README Deployment).
# [[services]]
# name = "weekly-discovery-cron"
# type = "cron"
# schedule = "0 15 * * 0"
# startCommand = "python -m watcher.jobs.discovery"

[[services]]
name = "weekly-scan-taste-update-cron"
type = "cron"
schedule = "0 13 * * 0"
startCommand = "python -m watcher.sync_creators"

[[services]]
name = "sms-webhook"
type = "web"
startCommand = "gunicorn watcher.webhook:app --bind 0.0.0.0:$PORT --workers 2"
